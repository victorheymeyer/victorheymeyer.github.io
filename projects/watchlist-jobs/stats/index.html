<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stats</title>
<link rel="stylesheet" href="/styles.css">
<script defer src="/site.js"></script>
<script defer src="/site-footer.js"></script>
</head>
<body>
<div id="siteNav"></div>
<div class="wrap">
  <h1>Stats</h1>
  <div class="sub">Dashboards and reference data for the watchlist jobs project.</div>

  <div id="errBox"></div>

  <div id="sections"></div>

  <h2>Table Stats</h2>
  <div class="sub">Nightly storage and shape monitoring for the watchlist-jobs tables &mdash; rows, size, and column-level breadth, captured once a day rather than computed live.</div>

  <div id="tableSections"></div>

  <div id="siteFooter"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---- Config ----
const SUPABASE_URL = "https://gfwzdluwljtcbvmmkktd.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd3pkbHV3bGp0Y2J2bW1ra3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2ODA2MjcsImV4cCI6MjA5ODI1NjYyN30.bGjryWzUobX--FFFmBPlEorY8Tb9qpm_aGDEW0ApBps";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

// One entry per page in this stats/ folder. Add a new entry (title, href,
// desc, and a load() that returns [{label, value}, ...]) when a new
// stats subpage is added; the section renders itself from that.
const SECTIONS = [
  {
    title: "Top Employers (WA)",
    href: "top_employers.html",
    desc: "Top 50 companies by number of open Washington-based postings on the latest fetch day.",
    load: async () => {
      // Queried against raw_watchlist_jobs (not the jobs_location_flags view)
      // so idx_raw_watchlist_jobs_snapshot_date makes this an index scan
      // instead of forcing a full join expansion.
      const { data: latest, error: e1 } = await supabaseClient
        .from("raw_watchlist_jobs").select("snapshot_date")
        .order("snapshot_date", { ascending: false }).limit(1);
      if (e1) throw e1;
      if (!latest || !latest.length) return [{ label: "WA postings", value: 0 }];
      const snapshotDate = latest[0].snapshot_date;

      const { data, error } = await supabaseClient
        .from("jobs_location_flags")
        .select("watchlist_company")
        .eq("snapshot_date", snapshotDate)
        .eq("maybe_wa", true)
        .limit(10000);
      if (error) throw error;
      const rows = data || [];
      const companies = new Set(rows.map(r => r.watchlist_company));
      return [
        { label: "WA postings", value: rows.length },
        { label: "Companies", value: companies.size },
      ];
    }
  },
  {
    title: "Watchlist Companies",
    href: "watchlist.html",
    desc: "Every company on the watchlist, its ATS, slug, and active status.",
    load: async () => {
      const { data, error } = await supabaseClient
        .from("watchlist_companies")
        .select("ats,active");
      if (error) throw error;
      const rows = data || [];
      const active = rows.filter(r => r.active).length;
      const atsCount = new Set(rows.map(r => r.ats).filter(Boolean)).size;
      return [
        { label: "Companies", value: rows.length },
        { label: "Active", value: active },
        { label: "Inactive", value: rows.length - active },
        { label: "ATS", value: atsCount },
      ];
    }
  }
];

// One entry per templated table page in ../tables/. Add a new entry when the
// template is applied to another table; the row renders itself from table_stats.
const TABLES = [
  {
    title: "job_content",
    href: "../tables/job_content.html",
    desc: "Per-job dimension table, upserted on (watchlist_company, ats_id). description/raw are retained only for Seattle-relevant postings."
  },
  {
    title: "raw_watchlist_jobs",
    href: "../tables/raw_watchlist_jobs.html",
    desc: "Immutable daily snapshot fact table, pruned to 7 days of retention."
  },
  {
    title: "watchlist_companies",
    href: "../tables/watchlist_companies.html",
    desc: "Hand-curated list of companies scraped daily; edited directly, not scraped."
  },
  {
    title: "ats_company_directory",
    href: "../tables/ats_company_directory.html",
    desc: "Candidate-company directory across ATS platforms, rebuilt in one pass monthly."
  }
];

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function showError(msg) {
  document.getElementById("errBox").innerHTML =
    '<div class="err"><strong>Could not load data.</strong><br>' + msg + '</div>';
}

function statCard(label, value) {
  return '<div class="stat-chip"><div class="n">' + Number(value).toLocaleString() + '</div><div class="l">' + esc(label) + '</div></div>';
}

function statChip(label, value) {
  return '<div class="stat-chip"><div class="n">' + esc(value) + '</div><div class="l">' + esc(label) + '</div></div>';
}

function fmtBytes(n) {
  if (n == null) return "-";
  const units = ["bytes", "kB", "MB", "GB", "TB"];
  let v = Number(n), i = 0;
  while (Math.abs(v) >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return (dt.getMonth() + 1) + "/" + dt.getDate() + "/" + dt.getFullYear();
}

async function loadTableStats(tableName) {
  const { data, error } = await supabaseClient
    .from("table_stats").select("captured_date,row_count,total_bytes,dead_tuples,captured_at")
    .eq("table_name", tableName)
    .order("captured_date", { ascending: false })
    .limit(2);
  if (error) throw error;
  const rows = data || [];
  if (!rows.length) return [{ label: "Status", value: "No captures yet" }];

  const latest = rows[0];
  const stats = [
    { label: "Rows", value: latest.row_count.toLocaleString() },
    { label: "Dead tuples", value: (latest.dead_tuples || 0).toLocaleString() },
    { label: "Total size", value: fmtBytes(latest.total_bytes) }
  ];

  if (rows.length > 1) {
    const prev = rows[1];
    const days = Math.max(1, Math.round((new Date(latest.captured_date) - new Date(prev.captured_date)) / 86400000));
    const perDay = Math.round((latest.row_count - prev.row_count) / days);
    stats.push({ label: "Rows/day", value: (perDay > 0 ? "+" : "") + perDay.toLocaleString() });
  }

  stats.push({ label: "Last captured", value: fmtDate(latest.captured_date) });
  return stats;
}

async function renderTable(table) {
  const panel = document.createElement("div");
  panel.className = "stat-row";
  panel.innerHTML =
    '<div class="stat-row-info">' +
      '<h2><a href="' + esc(table.href) + '">' + esc(table.title) + '</a></h2>' +
      '<p class="hint">' + esc(table.desc) + '</p>' +
    '</div>' +
    '<div class="stat-row-stats stat-loading">Loading stats...</div>';
  document.getElementById("tableSections").appendChild(panel);

  const statsEl = panel.querySelector(".stat-row-stats");
  try {
    const stats = await loadTableStats(table.title);
    statsEl.classList.remove("stat-loading");
    statsEl.textContent = "";
    statsEl.innerHTML = stats.map(s => statChip(s.label, s.value)).join("");
  } catch (err) {
    statsEl.textContent = "";
    showError((err && err.message) ? err.message : String(err));
  }
}

async function renderSection(section) {
  const panel = document.createElement("div");
  panel.className = "stat-row";
  panel.innerHTML =
    '<div class="stat-row-info">' +
      '<h2><a href="' + esc(section.href) + '">' + esc(section.title) + '</a></h2>' +
      '<p class="hint">' + esc(section.desc) + '</p>' +
    '</div>' +
    '<div class="stat-row-stats stat-loading">Loading stats...</div>';
  document.getElementById("sections").appendChild(panel);

  const statsEl = panel.querySelector(".stat-row-stats");
  try {
    const stats = await section.load();
    statsEl.classList.remove("stat-loading");
    statsEl.textContent = "";
    statsEl.innerHTML = stats.map(s => statCard(s.label, s.value)).join("");
  } catch (err) {
    statsEl.textContent = "";
    showError((err && err.message) ? err.message : String(err));
  }
}

SECTIONS.forEach(renderSection);
TABLES.forEach(renderTable);
</script>
</body>
</html>
