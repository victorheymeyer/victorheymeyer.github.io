const SUPABASE_URL = "https://gfwzdluwljtcbvmmkktd.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdmd3pkbHV3bGp0Y2J2bW1ra3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI2ODA2MjcsImV4cCI6MjA5ODI1NjYyN30.bGjryWzUobX--FFFmBPlEorY8Tb9qpm_aGDEW0ApBps";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

// KPI row: full-width headline stat + trend sparkline, sourced from job_stats
// history. Add an entry (label, hint, column, targetValue, and optionally
// unit/decimals) for each new KPI.
const KPIS = [
  {
    label: "ATS Count",
    hint: "Distinct ATS platforms currently yielding active postings.",
    column: "ats_count_with_active_jobs",
    targetValue: 10,
  },
  {
    label: "Active Jobs",
    hint: "Open postings on the latest snapshot located in Seattle or remote-WA.",
    column: "job_count_active_seattle_or_remote_wa",
    targetValue: 10000,
  },
  {
    label: "Active Companies",
    hint: "Companies with at least one active posting in Seattle or remote-WA on the latest snapshot.",
    column: "company_count_any_active_jobs_seattle_or_remote_wa",
    targetValue: 500,
  },
  {
    label: "DB Size",
    hint: "Total Supabase Postgres database size (all tables and indexes; not Storage buckets). Max size for free account is 500MB.",
    column: "storage_mb_total",
    targetValue: 350,

const kpiCharts = [];

// One entry per page in this stats/ folder. Add a new entry (title, href,
// desc, and a load() that returns [{label, value}, ...]) when a new
// stats subpage is added; the section renders itself from that.
const SECTIONS = [
  {
    title: "Job Stats",
    href: "jobstats.html",
    desc: "Daily company and job counts by active-vs-new status and Seattle/RemoteWA geography.",
    load: async () => {
      const { data, error } = await supabaseClient
        .from("job_stats")
        .select("company_count_any_active_jobs_global,job_count_active_global,company_count_any_new_jobs_global,job_count_new_global,snapshot_date")
        .order("snapshot_date", { ascending: false })
        .limit(1);
      if (error) throw error;
      if (!data || !data.length) return [{ label: "Status", value: "No captures yet" }];
      const row = data[0];
      return [
        { label: "Companies w/ active jobs", value: row.company_count_any_active_jobs_global },
        { label: "Active jobs", value: row.job_count_active_global },
        { label: "Companies w/ new jobs", value: row.company_count_any_new_jobs_global },
        { label: "New jobs", value: row.job_count_new_global },
      ];
    }
  },
  {
    title: "Top Employers (WA)",
    href: "top_employers.html",
    desc: "Top 50 companies by number of open Washington-based postings on the latest fetch day.",
    load: async () => {
      // Queried against raw_watchlist_jobs (not the jobs_location_flags view)
      // so idx_raw_watchlist_jobs_snapshot_date makes this an index scan
      // instead of forcing a full join expansion.
      const { data: latest, error: e1 } = await supabaseClient
        .from("raw_watchlist_jobs").select("snapshot_date")
        .order("snapshot_date", { ascending: false }).limit(1);
      if (e1) throw e1;
      if (!latest || !latest.length) return [{ label: "WA postings", value: 0 }];
      const snapshotDate = latest[0].snapshot_date;

      const { data, error } = await supabaseClient
        .from("jobs_location_flags")
        .select("watchlist_company")
        .eq("snapshot_date", snapshotDate)
        .eq("maybe_wa", true)
        .limit(10000);
      if (error) throw error;
      const rows = data || [];
      const companies = new Set(rows.map(r => r.watchlist_company));
      return [
        { label: "WA postings", value: rows.length },
        { label: "Companies", value: companies.size },
      ];
    }
  },
  {
    title: "ATS Platforms",
    href: "ats.html",
    desc: "Companies and active jobs broken down by ATS platform, with example companies for each.",
    load: async () => {
      const { data, error } = await supabaseClient
        .from("job_stats")
        .select("ats_count_watchlist_active,ats_count_with_active_jobs,snapshot_date")
        .order("snapshot_date", { ascending: false })
        .limit(1);
      if (error) throw error;
      if (!data || !data.length) return [{ label: "Status", value: "No captures yet" }];
      const row = data[0];
      return [
        { label: "ATS configured", value: row.ats_count_watchlist_active },
        { label: "ATS yielding jobs", value: row.ats_count_with_active_jobs },
      ];
    }
  },
  {
    title: "Watchlist Companies",
    href: "watchlist.html",
    desc: "Every company on the watchlist, its ATS, slug, and active status.",
    load: async () => {
      const { data, error } = await supabaseClient
        .from("watchlist_companies")
        .select("ats,active");
      if (error) throw error;
      const rows = data || [];
      const active = rows.filter(r => r.active).length;
      const atsCount = new Set(rows.map(r => r.ats).filter(Boolean)).size;
      return [
        { label: "Companies", value: rows.length },
        { label: "Active", value: active },
        { label: "Inactive", value: rows.length - active },
        { label: "ATS", value: atsCount },
      ];
    }
  }
];

// One entry per templated table page in ../tables/. Add a new entry when the
// template is applied to another table; the row renders itself from table_stats.
const TABLES = [
  {
    title: "job_content",
    href: "../tables/job_content.html",
    desc: "Per-job dimension table, upserted on (watchlist_company, ats_id). description/raw are retained only for Seattle-relevant postings."
  },
  {
    title: "raw_watchlist_jobs",
    href: "../tables/raw_watchlist_jobs.html",
    desc: "Immutable daily snapshot fact table, pruned to 7 days of retention."
  },
  {
    title: "watchlist_companies",
    href: "../tables/watchlist_companies.html",
    desc: "Hand-curated list of companies scraped daily; edited directly, not scraped."
  },
  {
    title: "ats_company_directory",
    href: "../tables/ats_company_directory.html",
    desc: "Candidate-company directory across ATS platforms, rebuilt in one pass monthly."
  }
];

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function showError(msg) {
  document.getElementById("errBox").innerHTML =
    '<div class="err"><strong>Could not load data.</strong><br>' + msg + '</div>';
}

function statCard(label, value) {
  return '<div class="stat-chip"><div class="n">' + Number(value).toLocaleString() + '</div><div class="l">' + esc(label) + '</div></div>';
}

function statChip(label, value) {
  return '<div class="stat-chip"><div class="n">' + esc(value) + '</div><div class="l">' + esc(label) + '</div></div>';
}

function fmtBytes(n) {
  if (n == null) return "-";
  const units = ["bytes", "kB", "MB", "GB", "TB"];
  let v = Number(n), i = 0;
  while (Math.abs(v) >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + " " + units[i];
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  if (isNaN(dt)) return d;
  return (dt.getMonth() + 1) + "/" + dt.getDate() + "/" + dt.getFullYear();
}

async function loadTableStats(tableName) {
  const { data, error } = await supabaseClient
    .from("table_stats").select("captured_date,row_count,total_bytes,dead_tuples,captured_at")
    .eq("table_name", tableName)
    .order("captured_date", { ascending: false })
    .limit(2);
  if (error) throw error;
  const rows = data || [];
  if (!rows.length) return [{ label: "Status", value: "No captures yet" }];

  const latest = rows[0];
  const stats = [
    { label: "Rows", value: latest.row_count.toLocaleString() },
    { label: "Dead tuples", value: (latest.dead_tuples || 0).toLocaleString() },
    { label: "Total size", value: fmtBytes(latest.total_bytes) }
  ];

  if (rows.length > 1) {
    const prev = rows[1];
    const days = Math.max(1, Math.round((new Date(latest.captured_date) - new Date(prev.captured_date)) / 86400000));
    const perDay = Math.round((latest.row_count - prev.row_count) / days);
    stats.push({ label: "Rows/day", value: (perDay > 0 ? "+" : "") + perDay.toLocaleString() });
  }

  stats.push({ label: "Last captured", value: fmtDate(latest.captured_date) });
  return stats;
}

async function renderTable(table) {
  const panel = document.createElement("div");
  panel.className = "stat-row";
  panel.innerHTML =
    '<div class="stat-row-info">' +
      '<h2><a href="' + esc(table.href) + '">' + esc(table.title) + '</a></h2>' +
      '<p class="hint">' + esc(table.desc) + '</p>' +
    '</div>' +
    '<div class="stat-row-stats stat-loading">Loading stats...</div>';
  document.getElementById("tableSections").appendChild(panel);

  const statsEl = panel.querySelector(".stat-row-stats");
  try {
    const stats = await loadTableStats(table.title);
    statsEl.classList.remove("stat-loading");
    statsEl.textContent = "";
    statsEl.innerHTML = stats.map(s => statChip(s.label, s.value)).join("");
  } catch (err) {
    statsEl.textContent = "";
    showError((err && err.message) ? err.message : String(err));
  }
}

async function loadKpiHistory(column) {
  const { data, error } = await supabaseClient
    .from("job_stats")
    .select("snapshot_date," + column)
    .order("snapshot_date", { ascending: true })
    .not(column, "is", null)
    .limit(400);
  if (error) throw error;
  return data || [];
}

function drawSparkline(canvas, rows, column, target) {
  const wrap = canvas.parentElement;
  const wrapStyle = getComputedStyle(wrap);
  const innerW = wrap.clientWidth - parseFloat(wrapStyle.paddingLeft) - parseFloat(wrapStyle.paddingRight);
  const cssW = Math.max(160, innerW || 160);
  const cssH = 60;
  const dpr = window.devicePixelRatio || 1;
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);

  if (rows.length < 2) {
    ctx.fillStyle = "#9aa3b2";
    ctx.font = "12px -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Not enough history yet", cssW / 2, cssH / 2);
    return;
  }

  const padX = 4, padY = 6;
  const plotW = cssW - padX * 2, plotH = cssH - padY * 2;
  const values = rows.map(r => Number(r[column]));
  const min = 0;
  let max = Math.max(...values);
  if (target != null) max = Math.max(max, target);
  const range = max - min || 1;

  const points = values.map((v, i) => [
    padX + (i / (values.length - 1)) * plotW,
    padY + plotH - ((v - min) / range) * plotH,
  ]);

  if (target != null) {
    const ty = padY + plotH - ((target - min) / range) * plotH;
    ctx.save();
    ctx.setLineDash([3, 2]);
    ctx.strokeStyle = "rgba(154, 163, 178, 0.6)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padX, ty);
    ctx.lineTo(cssW - padX, ty);
    ctx.stroke();
    ctx.restore();

    ctx.font = "9px -apple-system, Segoe UI, Roboto, sans-serif";
    ctx.fillStyle = "#9aa3b2";
    ctx.textAlign = "left";
    const labelBelow = ty < padY + 9;
    ctx.textBaseline = labelBelow ? "top" : "bottom";
    ctx.fillText(Number(target).toLocaleString(), padX + 2, ty + (labelBelow ? 2 : -2));
  }

  ctx.beginPath();
  ctx.moveTo(points[0][0], cssH - padY);
  points.forEach(([x, y]) => ctx.lineTo(x, y));
  ctx.lineTo(points[points.length - 1][0], cssH - padY);
  ctx.closePath();
  ctx.fillStyle = "rgba(79, 156, 255, 0.10)";
  ctx.fill();

  ctx.beginPath();
  points.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
  ctx.strokeStyle = "#4f9cff";
  ctx.lineWidth = 2;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.stroke();

  const [lx, ly] = points[points.length - 1];
  ctx.beginPath();
  ctx.arc(lx, ly, 4, 0, Math.PI * 2);
  ctx.fillStyle = "#171a21";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(lx, ly, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = "#4f9cff";
  ctx.fill();

  ctx.font = "10px -apple-system, Segoe UI, Roboto, sans-serif";
  ctx.fillStyle = "#e6e8ec";
  ctx.textAlign = "right";
  const labelBelow = ly < padY + 10;
  ctx.textBaseline = labelBelow ? "top" : "bottom";
  ctx.fillText(values[values.length - 1].toLocaleString(), lx - 6, ly + (labelBelow ? 6 : -6));
}

function fmtKpiValue(kpi, n) {
  if (n == null || isNaN(n)) return "-";
  const opts = kpi.decimals != null
    ? { minimumFractionDigits: kpi.decimals, maximumFractionDigits: kpi.decimals }
    : undefined;
  return Number(n).toLocaleString(undefined, opts) + (kpi.unit ? " " + kpi.unit : "");
}

async function renderKpi(kpi) {
  const row = document.createElement("div");
  row.className = "kpi-row";
  row.innerHTML =
    '<div class="kpi-sec kpi-sec-title">' +
      '<div class="kpi-label">' + esc(kpi.label) + '</div>' +
      '<div class="kpi-value">&hellip;</div>' +
    '</div>' +
    '<div class="kpi-sec kpi-sec-pct">' +
      '<div class="kpi-label">% of Target</div>' +
      '<div class="kpi-value kpi-pct-value">&hellip;</div>' +
    '</div>' +
    '<div class="kpi-sec kpi-sec-target">' +
      '<div class="kpi-label">Target</div>' +
      '<div class="kpi-value">' + esc(Number(kpi.targetValue).toLocaleString()) + '</div>' +
    '</div>' +
    '<div class="kpi-sec kpi-sec-chart"><canvas></canvas></div>' +
    '<div class="kpi-sec kpi-sec-desc">' +
      '<p class="kpi-hint">' + esc(kpi.hint) + '</p>' +
      '<code class="kpi-col">' + esc(kpi.column) + '</code>' +
    '</div>';
  document.getElementById("kpiSection").appendChild(row);

  const valueEl = row.querySelector(".kpi-value");
  const pctEl = row.querySelector(".kpi-pct-value");
  const canvas = row.querySelector("canvas");
  try {
    const rows = await loadKpiHistory(kpi.column);
    const latest = rows.length ? Number(rows[rows.length - 1][kpi.column]) : null;
    valueEl.textContent = fmtKpiValue(kpi, latest);
    pctEl.textContent = (latest != null && kpi.targetValue)
      ? Math.round((latest / kpi.targetValue) * 100) + "%"
      : "-";
    kpiCharts.push({ canvas, rows, column: kpi.column, target: kpi.targetValue });
    drawSparkline(canvas, rows, kpi.column, kpi.targetValue);
  } catch (err) {
    valueEl.textContent = "-";
    pctEl.textContent = "-";
    showError((err && err.message) ? err.message : String(err));
  }
}

async function renderSection(section) {
  const panel = document.createElement("div");
  panel.className = "stat-row";
  panel.innerHTML =
    '<div class="stat-row-info">' +
      '<h2><a href="' + esc(section.href) + '">' + esc(section.title) + '</a></h2>' +
      '<p class="hint">' + esc(section.desc) + '</p>' +
    '</div>' +
    '<div class="stat-row-stats stat-loading">Loading stats...</div>';
  document.getElementById("sections").appendChild(panel);

  const statsEl = panel.querySelector(".stat-row-stats");
  try {
    const stats = await section.load();
    statsEl.classList.remove("stat-loading");
    statsEl.textContent = "";
    statsEl.innerHTML = stats.map(s => statCard(s.label, s.value)).join("");
  } catch (err) {
    statsEl.textContent = "";
    showError((err && err.message) ? err.message : String(err));
  }
}

KPIS.forEach(renderKpi);
SECTIONS.forEach(renderSection);
TABLES.forEach(renderTable);

window.addEventListener("resize", () => {
  kpiCharts.forEach(k => drawSparkline(k.canvas, k.rows, k.column, k.target));
});
</script>
