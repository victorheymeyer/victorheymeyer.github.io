name: Probe ATS Companies Daily

on:
  schedule:
    # ~02:07 UTC (~7 PM PDT, evening Seattle time) -- clear of the other
    # daily crons in this repo, all clustered overnight Pacific (watchlist-
    # jobs 09:17 UTC/2:17 AM PDT, fetch-airbnb-jobs 10:00/3 AM, fetch-pricing
    # 11:00/4 AM, capture-table-stats 12:15/5:15 AM), off the hour to dodge
    # queue contention. Per CLAUDE.md's cron-limitation note: GitHub Actions
    # cron is UTC-only, so this drifts ~1hr at DST and is never truly
    # Seattle-local -- that's permanent and accepted, not a bug to fix here.
    - cron: "7 2 * * *"
  workflow_dispatch:        # lets you run it manually from the Actions tab
    inputs:
      cap_override:
        description: >
          Optional per-ATS cap for testing (e.g. 2 caps every ATS to ~2
          companies instead of the real 100/20 production caps). Maps to
          PROBE_CAP_OVERRIDE. Leave blank for a normal, uncapped run.
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r projects/watchlist-jobs/company-search/requirements.txt
          pip install projects/watchlist-jobs/vendor/ats_scrapers-0.2.0-py3-none-any.whl

      - name: Run probe
        env:
          JOBS_SUPABASE_URL: ${{ secrets.JOBS_SUPABASE_URL }}
          JOBS_SUPABASE_SERVICE_KEY: ${{ secrets.JOBS_SUPABASE_SERVICE_KEY }}
          # Empty string on a scheduled (non-manual) run, which
          # probe_ats.py's main() treats as unset -- uncapped, real 100/20
          # caps from next_probe_batch(). Set only on a manual dispatch
          # where cap_override was provided.
          PROBE_CAP_OVERRIDE: ${{ github.event.inputs.cap_override }}
        run: python projects/watchlist-jobs/company-search/probe_ats.py
